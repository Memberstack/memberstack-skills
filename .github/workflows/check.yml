name: Check skill against server

# Fails when the skill and the live Memberstack MCP server disagree on the tool list.
# Runs on every pull request, on main, and once a week so server changes are noticed.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 15 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tool list matches the server
        run: node scripts/sync-tools.mjs --check
      - name: Manifest files are valid JSON
        run: |
          for file in .claude-plugin/plugin.json .claude-plugin/marketplace.json .mcp.json mcp.json plugin.json .cursor-plugin/plugin.json .codex-plugin/plugin.json .agents/plugins/marketplace.json; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$file"
          done
      - name: SKILL.md stays under 500 lines
        run: test "$(wc -l < skills/memberstack/SKILL.md)" -lt 500
